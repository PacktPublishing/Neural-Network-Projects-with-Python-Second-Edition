[project]
name = "nnp-2ed-ch7"
version = "0.1.0"
description = "Neural Network Projects 2nd edition examples"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9.21",
    "faiss-cpu>=1.15.0",
    "jupyterlab>=4.5.6",
    "kagglehub[pandas-datasets]>=1.0.0",
    "matplotlib>=3.11.0",
    "openai>=3.15.0",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pyarrow>=25.0.1",
    "pytest>=9.0.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "sentencepiece>=0.2.2",
    "setuptools==81.0.0",
    "tensorboard>=2.20.0",
    "timer-context~=1.1.1",
    "tokenizers>=0.22.2",
    "torch>=2.12.1",
    "transformers[torch]>=5.15.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
